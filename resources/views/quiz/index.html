{{define "content"}}
<div class="grid gap-6 md:grid-cols-2" data-testid="quiz-grid">
	<section id="question" class="rounded-xl border border-zinc-200 p-6 dark:border-zinc-800" aria-labelledby="question-title">
		<h1 id="question-title" class="text-xl font-semibold">Questions are coming soon.</h1>
		<p class="mt-2 text-zinc-600 dark:text-zinc-400">The quiz engine is being built.</p>
	</section>
	<aside id="explanation" class="rounded-xl border border-zinc-200 p-6 dark:border-zinc-800" aria-live="polite">
		<p class="text-zinc-600 dark:text-zinc-400">Pick an answer to see the explanation.</p>
	</aside>
</div>
{{end}}
