# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# Adapted from the vukem framework's config.
version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      module-path: github.com/AlexGalhardo/vukem-golang-quiz-htmx
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/AlexGalhardo/vukem-golang-quiz-htmx)
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: true

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - makezero
    - musttag
    - nilerr
    - noctx
    - reassign
    - depguard
    - gosec
    - copyloopvar
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - intrange
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - thelper
    - tparallel
    - usetesting
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the standard library and go-cmp
            - pkg: math/rand$
              desc: use math/rand/v2 (shuffles) or crypto/rand (secrets)
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        - unnamedResult
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: unexported-return
        - name: unused-parameter
        - name: var-naming
    sloglint:
      context: scope
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          - gosec
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
